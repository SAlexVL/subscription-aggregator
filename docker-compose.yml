services:
  postgres:
    image: postgres:16-alpine
    container_name: subscription-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-subscriptions}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-subscriptions}
      POSTGRES_DB: ${DB_NAME:-subscriptions}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-subscriptions} -d ${DB_NAME:-subscriptions}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: subscription-api
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      CONFIG_PATH: /app/config.yaml
      MIGRATIONS_DIR: /app/migrations
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
